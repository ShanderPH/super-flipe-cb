# Experimental runtime. No legacy save or installed RetroArch configuration is used.
video_driver = "gl"
video_context_driver = "gl_sdl"
input_driver = "sdl2"
input_joypad_driver = "sdl2"
audio_driver = "pulse"
video_fullscreen = "true"
video_fullscreen_x = "1920"
video_fullscreen_y = "1080"
video_vsync = "true"
video_smooth = "false"
video_threaded = "false"
video_shader_enable = "false"
video_scale_integer = "false"
aspect_ratio_index = "22"
audio_sync = "true"
audio_latency = "64"
rewind_enable = "false"
run_ahead_enabled = "false"
preemptive_frames_enable = "false"
menu_driver = "rgui"
menu_pause_libretro = "true"
menu_enable_widgets = "false"
input_overlay_enable = "false"
input_auto_game_focus = "0"
# INPUT_COMBO_START_SELECT in the pinned 1.22.2 input_defines.h.
input_menu_toggle_gamepad_combo = "4"
input_menu_toggle_btn = "nul"
input_exit_emulator_btn = "nul"
input_save_state_btn = "nul"
input_load_state_btn = "nul"
# SDL GameController uses canonical axes: left X/Y 0/1, right X/Y 2/3.
# Left stick also controls digital-only SNES/PS1 pads; native analog devices
# keep their axes when the core requests analog input (non-forced mode).
input_player1_analog_dpad_mode = "1"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+2"
input_player1_r_x_minus_axis = "-2"
input_player1_r_y_plus_axis = "+3"
input_player1_r_y_minus_axis = "-3"
input_analog_deadzone = "0.20"
input_analog_sensitivity = "1.00"
pause_nonactive = "true"
config_save_on_exit = "false"
autosave_interval = "10"
savestate_auto_save = "false"
savestate_auto_load = "false"
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"
sram_file_compression = "false"
network_cmd_enable = "false"
stdin_cmd_enable = "false"
network_remote_enable = "false"
netplay_public_announce = "false"
content_history_size = "0"
log_verbosity = "true"
